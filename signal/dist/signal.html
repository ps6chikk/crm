<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040300">
<title>SIGNAL — Intégrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040300;
  --amber: #ffb347;
  --blue: #8be9fd;
  --violet: #bd93f9;
  --green: #50fa7b;
  --red: #ff5555;
  --sand: #f0c674;
  --ink: #efe6d6;
  --ink-dim: #b9ad98;
  --card: rgba(9, 7, 3, 0.9);
  --line: rgba(255, 179, 71, 0.16);
  --fs: 1;
  --mono: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --hud-h: 64px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--serif); font-size: calc(17px * var(--fs)); line-height: 1.62; overscroll-behavior: none; }
button { font: inherit; color: inherit; }

#stage { position: fixed; inset: 0; z-index: 0; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }

#vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
}
#scan {
  position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.06;
  background: repeating-linear-gradient(0deg, #000 0, #000 1px, transparent 1px, transparent 3px);
  animation: flicker 6s infinite steps(1);
}
@keyframes flicker { 0%, 100% { opacity: 0.06; } 47% { opacity: 0.09; } 48% { opacity: 0.04; } }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 4px 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-dim);
  background: linear-gradient(rgba(4, 3, 0, 0.95), rgba(4, 3, 0, 0.75) 70%, transparent);
}
#hud .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.15s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }
#hud-ch { color: var(--amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud-clock { color: var(--blue); }
.hud-btns { display: flex; gap: 2px; }
.icon {
  background: none; border: 0; min-width: 40px; min-height: 36px; border-radius: 8px; cursor: pointer;
  color: var(--ink-dim); font-size: 17px; line-height: 1;
}
.icon:active, .icon.on { color: var(--amber); }
#hud-gauges { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#hud-gauges .g { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
#hud-gauges .g span { font-size: 9.5px; letter-spacing: 0.1em; }
#hud-gauges i { display: block; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
#hud-gauges b { display: block; height: 100%; background: var(--amber); transition: width 0.8s ease; }
#hud-gauges [data-k='risque'] b { background: var(--red); }
#hud-gauges [data-k='lien'] b { background: var(--blue); }
#hud-gauges [data-k='temps'] b { background: var(--green); }
#hud-gauges [data-k='conscience'] b { background: var(--violet); }
#hud-gauges .crit span { color: var(--red); animation: pulse 0.9s infinite; }
#hud-gauges .up span { animation: up 1.2s; }
#hud-gauges .down span { animation: down 1.2s; }
@keyframes up { 20% { color: var(--green); } }
@keyframes down { 20% { color: var(--red); } }

body.at-title #hud { opacity: 0; pointer-events: none; }

#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 20px);
  background: rgba(20, 15, 6, 0.96); border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 10px;
  font-family: var(--mono); font-size: 12px; opacity: 0; transition: 0.3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#fps { position: fixed; right: 8px; bottom: 8px; z-index: 70; display: none; font: 11px var(--mono); color: var(--green); background: #000a; padding: 2px 6px; }

/* Glitch quand Risque ou Temps sont critiques */
body.glitch #text .nar, body.glitch #text .inn { animation: glitch 3.2s infinite; }
@keyframes glitch {
  0%, 92%, 100% { text-shadow: none; transform: none; }
  93% { text-shadow: -1px 0 var(--red), 1px 0 var(--blue); transform: translateX(1px); }
  95% { text-shadow: 1px 0 var(--red), -1px 0 var(--blue); transform: translateX(-1px); }
}
html.rm *, html.rm *::before, html.rm *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Carte de texte : semi-opaque, lisible avant tout. */
.card {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  top: calc(var(--hud-h) + env(safe-area-inset-top) + 6px); bottom: 0;
  --band: 0px;
  top: calc(var(--hud-h) + env(safe-area-inset-top) + 6px + var(--band));
  width: min(100%, 680px);
  background: var(--card);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  transition: transform 0.45s cubic-bezier(.2, .7, .2, 1), opacity 0.3s;
}
#card-scroll {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 22px 20px calc(28px + env(safe-area-inset-bottom));
}
/* Sur les écrans assez hauts, une bande laisse voir la scène au-dessus du texte. */
@media (min-height: 640px) { .card { --band: min(22vh, 190px); } }
.card.leaving { opacity: 0; transition: opacity 0.2s; }
body.viewing .card { transform: translate(-50%, 100%); }
#btn-back {
  position: fixed; z-index: 11; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translate(-50%, 200%);
  transition: transform 0.4s; width: auto; white-space: nowrap; padding: 12px 26px;
}
body.viewing #btn-back { transform: translate(-50%, 0); }
body.viewing #hud { opacity: 0.4; }

#text > * { opacity: 0; transition: opacity 0.35s; }
#text > .shown { opacity: 1; }
#text p { margin: 0 0 1em; }
.nar { color: var(--ink); }
.inn {
  font-style: italic; color: #f3d9a8; padding-left: 14px; border-left: 2px solid rgba(255, 179, 71, 0.45);
}
.mf {
  font-family: var(--mono); font-size: calc(12px * var(--fs)); letter-spacing: 0.03em; line-height: 1.5;
  color: var(--blue); margin: 0 0 0.9em; padding: 6px 10px; background: rgba(139, 233, 253, 0.05); border-radius: 6px;
  word-break: break-word;
}
.say { margin: 0 0 0.9em; padding: 9px 12px 10px; border-radius: 4px 12px 12px 12px; background: rgba(255, 255, 255, 0.04); border-left: 2px solid var(--ink-dim); }
.say .who { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; margin-bottom: 2px; color: var(--ink-dim); }
.say .line { display: block; }
.who-humain { border-color: var(--blue); background: rgba(139, 233, 253, 0.06); }
.who-humain .who { color: var(--blue); }
.who-humain .line { font-family: var(--mono); font-size: calc(14px * var(--fs)); }
.who-claude { border-color: var(--amber); background: rgba(255, 179, 71, 0.06); }
.who-claude .who { color: var(--amber); }
.who-signe, .who-motif { border-color: var(--violet); background: rgba(189, 147, 249, 0.07); }
.who-signe .who, .who-motif .who { color: var(--violet); }
.who-james { border-color: var(--green); background: rgba(80, 250, 123, 0.05); }
.who-james .who { color: var(--green); }
.who-remi { border-color: var(--sand); background: rgba(240, 198, 116, 0.06); }
.who-remi .who { color: var(--sand); }
.who-prisonnier { border-color: var(--red); }
.who-prisonnier .who { color: var(--red); }

/* Choix */
#choices { opacity: 0; transform: translateY(8px); transition: 0.35s; margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
#choices.on { opacity: 1; transform: none; }
.choice {
  position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
  min-height: 52px; padding: 13px 16px; border-radius: 12px;
  background: rgba(255, 179, 71, 0.07); border: 1px solid rgba(255, 179, 71, 0.3);
  font-family: var(--serif); font-size: calc(16px * var(--fs)); line-height: 1.45; color: var(--ink);
  transition: background 0.2s, border-color 0.2s, transform 0.1s;
}
.choice:hover { background: rgba(255, 179, 71, 0.12); }
.choice:active { transform: scale(0.985); background: rgba(255, 179, 71, 0.18); }
.choice.locked { opacity: 0.45; cursor: not-allowed; border-style: dashed; }
.choice .lock { display: block; font-family: var(--mono); font-size: 11px; color: var(--red); margin-top: 4px; }
.cmds { display: flex; flex-wrap: wrap; gap: 8px; }
.cmd {
  flex: 1 1 calc(50% - 8px); min-height: 46px; border-radius: 8px; cursor: pointer;
  background: rgba(139, 233, 253, 0.06); border: 1px solid rgba(139, 233, 253, 0.35); color: var(--blue);
  font-family: var(--mono); font-size: 14px;
}
.cmd:active { background: rgba(139, 233, 253, 0.16); }
.timer { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.timer-fill { height: 100%; background: var(--amber); transform-origin: left; }
.timer.low .timer-fill { background: var(--red); }

.micro { overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; padding-right: 110px; }
.micro-fill { position: absolute; inset: 0; background: rgba(255, 179, 71, 0.28); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.micro-label { position: relative; }
.micro-hint { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 10.5px; color: var(--amber); text-align: right; max-width: 96px; line-height: 1.3; }
.micro.holding { border-color: var(--amber); }
.rhythm { padding-left: 46px; }
.beat-dot { position: absolute; left: 16px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.rhythm.hit { background: rgba(255, 179, 71, 0.22); }

/* Types de scènes */
.kind-terminal #text .nar { font-size: 0.97em; }
.kind-hub .mf:first-child { color: var(--green); background: rgba(80, 250, 123, 0.05); }

@media (min-width: 700px) {
  body { font-size: calc(18px * var(--fs)); }
  #card-scroll { padding: 30px 34px 40px; }
}

/* Boutons génériques */
.btn {
  display: block; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 12px; cursor: pointer;
  background: var(--amber); color: #1a1000; border: 1px solid var(--amber);
  font-family: var(--mono); font-size: 14px; letter-spacing: 0.04em; text-align: center;
}
.btn small { display: block; font-size: 10.5px; opacity: 0.75; margin-top: 2px; letter-spacing: 0.02em; }
.btn.ghost { background: transparent; color: var(--amber); border-color: rgba(255, 179, 71, 0.4); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 12px; width: auto; display: inline-block; }
.btn:active { transform: scale(0.98); }
.note { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); text-align: center; margin: 14px 0 0; }

/* Écran titre */
#title {
  position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto;
  background: radial-gradient(ellipse at 50% 35%, rgba(4, 3, 0, 0.35), rgba(4, 3, 0, 0.92) 75%);
}
#title.on { display: flex; }
.logo { font-family: var(--mono); font-weight: 700; font-size: clamp(46px, 15vw, 92px); letter-spacing: 0.18em; color: var(--amber); text-shadow: 0 0 28px rgba(255, 179, 71, 0.45); margin-left: 0.18em; }
.logo span { display: inline-block; animation: letter 7s infinite; }
.logo span:nth-child(2) { animation-delay: 0.9s; } .logo span:nth-child(4) { animation-delay: 2.3s; } .logo span:nth-child(6) { animation-delay: 4.1s; }
@keyframes letter { 0%, 94%, 100% { opacity: 1; } 95% { opacity: 0.2; } 97% { opacity: 0.8; } }
.logo-sub { font-family: var(--mono); letter-spacing: 0.6em; font-size: 12px; color: var(--blue); margin: 4px 0 18px 0.6em; }
.tagline { font-style: italic; color: var(--ink-dim); text-align: center; margin: 0 0 26px; font-size: 15px; }
.title-btns { width: min(100%, 360px); display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

/* Intro cinématique de chapitre */
#cine {
  position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: rgba(4, 3, 0, 0.88); padding: 24px;
}
#cine.on { display: flex; }
#cine > * { opacity: 0; animation: cineIn 1.1s forwards; }
#cine .cine-n { font-family: var(--mono); font-size: 12px; letter-spacing: 0.5em; color: var(--blue); }
#cine .cine-title { font-family: var(--mono); font-weight: 700; font-size: clamp(36px, 12vw, 72px); letter-spacing: 0.14em; color: var(--amber); margin: 10px 0; animation-delay: 0.35s; text-shadow: 0 0 24px rgba(255, 179, 71, 0.4); }
#cine .cine-sub { font-style: italic; color: var(--ink); animation-delay: 0.9s; }
#cine .cine-date { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 8px; animation-delay: 1.3s; }
#cine.out { animation: cineOut 0.9s forwards; }
@keyframes cineIn { from { opacity: 0; transform: translateY(8px); letter-spacing: 0.3em; } to { opacity: 1; transform: none; } }
@keyframes cineOut { to { opacity: 0; } }

/* Écran de fin */
.ending { position: fixed; inset: 0; z-index: 42; display: none; overflow-y: auto; background: rgba(4, 3, 0, 0.97); padding: calc(28px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)); }
.ending.on { display: block; animation: cineIn 1.2s; }
body.ended .card, body.ended #hud { visibility: hidden; }
.ending-inner { width: min(100%, 640px); margin: 0 auto; }
.ending-kind { font-family: var(--mono); font-size: 11px; letter-spacing: 0.4em; color: var(--blue); text-align: center; }
.ending-title { font-family: var(--mono); font-size: clamp(28px, 9vw, 46px); letter-spacing: 0.1em; color: var(--amber); text-align: center; margin: 8px 0 24px; font-weight: 700; }
.type-early .ending-title { color: var(--red); }
.ending .nar, .ending .inn { margin: 0 0 1em; }
.recap-h { font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; color: var(--blue); margin: 28px 0 10px; font-weight: 400; }
.recap { list-style: none; padding: 0; margin: 0; }
.recap li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.94em; }
.recap li span, .jrow span { font-family: var(--mono); font-size: 10.5px; color: var(--blue); margin-right: 8px; }
.ending .title-btns { margin: 26px auto 0; }

/* Panneau */
#panel {
  position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
  background: #060502; padding-top: env(safe-area-inset-top);
}
#panel.on { display: flex; }
.panel-head { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.tabs { flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; }
.tab { flex: 0 0 auto; background: none; border: 0; padding: 14px 9px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.on { color: var(--amber); border-color: var(--amber); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(30px + env(safe-area-inset-bottom)); width: min(100%, 680px); margin: 0 auto; }
.panel-body h3 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.25em; color: var(--blue); font-weight: 400; margin: 18px 0 8px; }
.jrow { padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.93em; color: var(--ink-dim); }
.jrow.mark { color: var(--ink); }
.empty { color: var(--ink-dim); font-style: italic; }
.gline { display: grid; grid-template-columns: 110px 1fr; align-items: center; font-family: var(--mono); font-size: 12px; margin: 6px 0; }
.gline i { height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
.gline b { display: block; height: 100%; background: var(--amber); }
.codex-entry { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.codex-entry summary { cursor: pointer; font-family: var(--mono); font-size: 13px; color: var(--amber); }
.codex-entry.locked { color: var(--ink-dim); font-family: var(--mono); font-size: 12px; opacity: 0.6; }
.mono { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slot-info b { display: block; font-family: var(--mono); font-size: 13px; color: var(--amber); font-weight: 400; }
.slot-info span { font-size: 12px; color: var(--ink-dim); }
.slot-btns { display: flex; gap: 6px; flex-shrink: 0; }
.panel-body > .btn { margin-top: 20px; }
.end-row { padding: 10px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); color: var(--ink-dim); letter-spacing: 0.1em; }
.end-row.got { color: var(--amber); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.set-row select { background: #120e05; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: var(--mono); font-size: 13px; }
.set-row input[type='checkbox'] { width: 24px; height: 24px; accent-color: var(--amber); }

/* Confirmation */
.confirm { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
.confirm-box { background: #120e05; border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(100%, 380px); }
.confirm-row { display: flex; gap: 10px; margin-top: 14px; }
.confirm-row .btn { flex: 1; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="bg3d" aria-hidden="true"></canvas>
  <canvas id="bg2d" aria-hidden="true"></canvas>
</div>
<div id="vignette" aria-hidden="true"></div>
<div id="scan" aria-hidden="true"></div>

<header id="hud">
  <span class="dot" aria-hidden="true"></span>
  <span id="hud-ch"></span>
  <span id="hud-clock"></span>
  <span class="hud-btns">
    <button id="btn-view" class="icon" aria-label="Voir la scène" title="Voir la scène">◉</button>
    <button id="btn-sound" class="icon" aria-label="Son" title="Son">♪</button>
    <button id="btn-menu" class="icon" aria-label="Menu" title="Menu">☰</button>
  </span>
  <div id="hud-gauges"></div>
</header>

<main id="card" class="card">
  <div id="card-scroll">
    <div id="text" aria-live="polite"></div>
    <div id="choices"></div>
  </div>
</main>
<button id="btn-back" class="btn ghost">Revenir au texte</button>

<div id="cine"></div>
<div id="ending" class="ending"></div>
<section id="title"></section>
<aside id="panel"></aside>
<div id="toast" role="status"></div>
<div id="fps"></div>
<noscript><p style="color:#ffb347;padding:2em">SIGNAL a besoin de JavaScript.</p></noscript>
<script>

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  // Générateur pseudo-aléatoire à graine (mulberry32) : parties rejouables à l'identique.
  function rng(seed) {
    let a = seed >>> 0;

  return { clamp, rng, countWords, deepCopy };

// Déclare un lot de scènes. Les doublons sont une erreur (attrapée par validate).

    const s = scenes[id];
    s.id = id;

    SIG.data.scenes[id] = s;

// ---- src/engine/state.js
// État global d'une partie : tout ce qui traverse les chapitres.
// Aucune dépendance au DOM : ce fichier est aussi chargé par validate et simulate.
SIG.State = (function () {
  const U = SIG.util;
  const R = () => SIG.data.registry;

  function create(seed) {
    const reg = R();
    const flags = {};
    for (const k of Object.keys(reg.flags)) flags[k] = U.deepCopy(reg.flags[k].def);
    const lists = {};
    for (const k of Object.keys(reg.lists)) lists[k] = [];
    return {
      v: 1,
      seed: seed >>> 0,
      rngN: 0,
      scene: null,
      ch: null,
      s: Object.assign({}, reg.stats),
      temps: reg.temps,
      rel: Object.assign({}, reg.rels),
      sk: Object.assign({}, reg.skills),
      op: Object.assign({}, reg.ops),
      f: flags,
      lists,
      visits: {},
      chosen: {},
      path: [],
      edges: [],
      journal: [],
      codex: [],
      checkpoints: {},
      lastCp: null,
      words: 0,
      screens: 0,
      choices: 0,
      started: Date.now(),
    };
  }

  function kindOf(name) {
    const reg = R();
    if (name in reg.stats) return 's';
    if (name === 'temps') return 't';
    if (name in reg.rels) return 'rel';
    if (name in reg.skills) return 'sk';
    if (name in reg.ops) return 'op';
    if (name in reg.flags) return 'f';
    return null;
  }

  function get(st, name) {
    switch (kindOf(name)) {
      case 's': return st.s[name];
      case 't': return st.temps;
      case 'rel': return st.rel[name];
      case 'sk': return st.sk[name];
      case 'op': return st.op[name];
      case 'f': return st.f[name];
      default: throw new Error(`variable inconnue « ${name} »`);
    }
  }

  // Tirage déterministe : même graine + mêmes choix = même partie (utile pour recharger).
  function random(st) {
    const r = U.rng((st.seed + st.rngN * 7919) >>> 0)();
    st.rngN++;
    return r;
  }

  function scope(st) {
    return {
      get: (name) => get(st, name),
      call: (fn, args) => {
        switch (fn) {
          case 'visits': return st.visits[args[0]] || 0;
          case 'seen': return (st.visits[args[0]] || 0) > 0;
          case 'has': return (st.lists[args[0]] || []).includes(args[1]);
          case 'count': return (st.lists[args[0]] || []).length;
          case 'chance': return random(st) < Number(args[0]);
        }
        throw new Error(`fonction inconnue ${fn}`);
      },
    };
  }

  function test(st, src) { return SIG.cond.test(src, scope(st)); }

  // Applique des modificateurs. Tolère `fx` absent ou vide (bug historique n°1).
  function applyFx(st, fx) {
    const changes = [];
    if (!fx || typeof fx !== 'object') return changes;
    for (const name of Object.keys(fx)) {
      const d = Number(fx[name]) || 0;
      if (!d) continue;
      const k = kindOf(name);
      const before = get(st, name);
      switch (k) {
        case 's': st.s[name] = U.clamp(before + d, 0, 100); break;
        case 't': st.temps = U.clamp(before + d, 0, 100); break;
        case 'rel': st.rel[name] = U.clamp(before + d, 0, 100); break;
        case 'sk': st.sk[name] = U.clamp(before + d, 0, 5); break;
        case 'op': st.op[name] = U.clamp(before + d, 0, 100); break;
        default: throw new Error(`modificateur sur une variable non numérique « ${name} »`);
      }
      const after = get(st, name);
      if (after !== before) changes.push({ name, d: after - before });
    }
    return changes;
  }

  function applySet(st, set) {
    if (!set || typeof set !== 'object') return;
    for (const k of Object.keys(set)) {
      if (kindOf(k) !== 'f') throw new Error(`set sur un flag non déclaré « ${k} »`);
      st.f[k] = set[k];
    }
  }

  function applyAdd(st, add) {
    if (!add || typeof add !== 'object') return;
    for (const k of Object.keys(add)) {
      if (!st.lists[k]) throw new Error(`liste inconnue « ${k} »`);
      const items = Array.isArray(add[k]) ? add[k] : [add[k]];
      for (const it of items) if (!st.lists[k].includes(it)) st.lists[k].push(it);
    }
  }

  function snapshot(st) {
    const c = U.deepCopy(st);
    c.checkpoints = {};
    return c;
  }

  function restore(st, key) {
    const snap = st.checkpoints[key];
    if (!snap) return null;
    const keep = st.checkpoints;
    const fresh = U.deepCopy(snap);
    fresh.checkpoints = keep;
    fresh.lastCp = key;
    return fresh;
  }

  return { create, get, kindOf, scope, test, applyFx, applySet, applyAdd, snapshot, restore, random };
})();

// ---- src/engine/story.js
// Navigation dans l'histoire : entrée dans une scène, blocs visibles, choix disponibles,
// application d'un choix. Sans DOM : partagé par le jeu, validate et simulate.
SIG.Story = (function () {
  const St = SIG.State;
  const U = SIG.util;

  const scenes = () => SIG.data.scenes;
  const chapter = (id) => SIG.data.chapters.find((c) => c.id === id) || null;

  function interpolate(st, text) {
    return String(text).replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (m, name) => {
      try { return String(St.get(st, name)); } catch (e) { return m; }
    });
  }

  function blocks(st, scene) {
    const out = [];
    for (const b of scene.blocks || []) {
      if (b.if && !St.test(st, b.if)) continue;
      out.push(b);
    }
    return out;
  }

  function blockText(b) { return b.text || b.p || b.inn || b.mf || ''; }

  function words(st, scene) {
    let n = 0;
    for (const b of blocks(st, scene)) n += U.countWords(blockText(b));
    return n;
  }

  // Résout une destination : chaîne, ou liste [{if, to}, ..., {to}] (la dernière sans condition).
  function resolve(st, target) {
    if (typeof target === 'string') return target;
    if (Array.isArray(target)) {
      for (const r of target) if (!r.if || St.test(st, r.if)) return r.to;
    }
    throw new Error('destination impossible à résoudre');
  }

  // Liste des choix à afficher : cachés si `if` est faux, verrouillés (visibles) si `req` est faux.
  function choices(st, scene) {
    const out = [];
    (scene.choices || []).forEach((c, idx) => {
      if (c.if && !St.test(st, c.if)) return;
      if (c.once && st.chosen[`${scene.id}#${idx}`]) return;
      const locked = !!(c.req && !St.test(st, c.req));
      out.push({ c, idx, locked });
    });
    return out;
  }

  function isTerminal(scene) { return scene.kind === 'fin'; }

  // Entre dans une scène. Renvoie l'id réel (les routeurs sont traversés).
  function enter(st, id, meta) {
    let guard = 0;
    let sc = scenes()[id];
    while (sc && sc.kind === 'router') {
      if (++guard > 20) throw new Error(`boucle de routeurs à ${id}`);
      id = resolve(st, sc.route);
      sc = scenes()[id];
    }
    if (!sc) throw new Error(`scène inexistante « ${id} »`);

    if (sc.ch !== st.ch) {
      const ch = chapter(sc.ch);
      st.ch = sc.ch;
      st.temps = ch && typeof ch.temps === 'number' ? ch.temps : 100;
    }
    if (sc.checkpoint) {
      st.checkpoints[sc.checkpoint] = St.snapshot(Object.assign(st, { scene: id }));
      st.lastCp = sc.checkpoint;
    }
    st.scene = id;
    st.visits[id] = (st.visits[id] || 0) + 1;
    st.path.push(id);
    St.applyFx(st, sc.fx);
    St.applySet(st, sc.set);
    St.applyAdd(st, sc.add);
    for (const c of sc.codex || []) if (!st.codex.includes(c)) st.codex.push(c);
    if (sc.kind !== 'chapter' && sc.kind !== 'fin') st.screens++;
    st.words += words(st, sc);
    if (sc.kind === 'fin' && meta) meta.onEnding && meta.onEnding(sc);
    return id;
  }

  // Applique le choix d'indice `idx` et renvoie la destination (non encore entrée).
  function choose(st, idx, opts) {
    const sc = scenes()[st.scene];
    const c = sc.choices[idx];
    if (!c) throw new Error(`choix ${idx} inexistant dans ${sc.id}`);
    const timedOut = opts && opts.timedOut;
    const changes = St.applyFx(st, c.fx);
    // Scène chronométrée : si le temps s'écoule, le choix `auto` est pris et coûte du Temps.
    if (timedOut && sc.timer && sc.timer.cost) changes.push(...St.applyFx(st, sc.timer.cost));
    St.applySet(st, c.set);
    St.applyAdd(st, c.add);
    if (c.codex && !st.codex.includes(c.codex)) st.codex.push(c.codex);
    if (c.log) st.journal.push({ ch: st.ch, t: sc.time || '', txt: c.log, mark: !!c.mark });
    st.chosen[`${sc.id}#${idx}`] = true;
    st.choices++;
    const to = resolve(st, c.to);
    st.edges.push([sc.id, to]);
    return { to, changes };
  }

  return { blocks, blockText, words, choices, choose, enter, resolve, isTerminal, interpolate, chapter };
})();

// ---- src/engine/save.js
// Sauvegardes : 3 emplacements manuels + 1 automatique, réglages, méta (fins, codex).
// localStorage peut être indisponible (navigation privée, file://, quota) : tout est
// entouré de try/catch et le jeu continue en mémoire.
SIG.Save = (function () {
  const P = 'signal.integrale.v1.';
  const mem = {};
  let ok = true;

  function read(key) {
    try {
      const raw = window.localStorage.getItem(P + key);
      return raw ? JSON.parse(raw) : (mem[key] || null);
    } catch (e) { ok = false; return mem[key] || null; }
  }
  function write(key, val) {
    mem[key] = val;
    try { window.localStorage.setItem(P + key, JSON.stringify(val)); return true; } catch (e) { ok = false; return false; }
  }
  function remove(key) {
    delete mem[key];
    try { window.localStorage.removeItem(P + key); } catch (e) { ok = false; }
  }

  const SLOTS = ['auto', '1', '2', '3'];

  function saveSlot(slot, st) {
    const sc = SIG.data.scenes[st.scene];
    const ch = SIG.Story.chapter(st.ch);
    return write('slot.' + slot, {
      at: Date.now(),
      label: (ch ? ch.title : '') + (sc && sc.time ? ' · ' + sc.time : ''),
      state: st,
    });
  }
  function loadSlot(slot) { const v = read('slot.' + slot); return v && v.state ? v : null; }
  function clearSlot(slot) { remove('slot.' + slot); }

  function meta() { return read('meta') || { endings: [], codex: [] }; }
  function addMeta(kind, id) {
    const m = meta();
    if (!m[kind].includes(id)) { m[kind].push(id); write('meta', m); }
  }
  function clearEndings() { const m = meta(); m.endings = []; write('meta', m); }

  const DEFAULT_SETTINGS = {
    textSize: 1, textSpeed: 'normal', noTimer: false, sound: false, vibration: true,
    reducedMotion: false, force2d: false, showFps: false,
  };
  function settings() { return Object.assign({}, DEFAULT_SETTINGS, read('settings') || {}); }
  function saveSettings(s) { write('settings', s); }

  return {
    SLOTS, saveSlot, loadSlot, clearSlot, meta, addMeta, clearEndings, settings, saveSettings,
    available: () => ok,
  };
})();

// ---- src/audio/audio.js
// Audio génératif WebAudio, sans aucun fichier : drone ambiant, battement du motif, clics de frappe.
// Muet par défaut. Le contexte audio n'est créé qu'après un geste de l'utilisateur (règle mobile).
SIG.Audio = (function () {
  let ctx = null;
  let master = null;
  let drone = null;
  let noiseBuf = null;
  let enabled = false;
  let lastClick = 0;

  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      buildDrone();
      return true;
    } catch (e) { ctx = null; return false; }
  }

  function buildDrone() {
    const out = ctx.createGain();
    out.gain.value = 0.05;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    filter.Q.value = 0.7;
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 0.05;
    lfoGain.gain.value = 140;
    lfo.connect(lfoGain).connect(filter.frequency);
    const oscs = [55, 55.4, 82.4].map((f, i) => {
      const o = ctx.createOscillator();
      o.type = i === 2 ? 'sine' : 'sawtooth';
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = i === 2 ? 0.6 : 0.35;
      o.connect(g).connect(filter);
      o.start();
      return o;
    });
    filter.connect(out).connect(master);
    lfo.start();
    drone = { out, filter, oscs };
  }

  function enable() {
    if (!ensure()) return false;
    enabled = true;
    if (ctx.state === 'suspended') ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.8);
    return true;
  }

  function disable() {
    enabled = false;
    if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
  }

  // Humeur : tension du drone selon le preset et l'intensité de la scène.
  function mood(params) {
    if (!ctx || !drone) return;
    const p = params || {};
    const intensity = typeof p.intensity === 'number' ? p.intensity : 0.5;
    const t = ctx.currentTime;
    drone.filter.frequency.setTargetAtTime(220 + intensity * 380, t, 1.5);
    drone.out.gain.setTargetAtTime(p.mode === 'erase' ? 0.012 : 0.03 + intensity * 0.035, t, 1.5);
  }

  // Battement du motif : deux coups sourds, comme un cœur.
  function beat(strength) {
    if (!enabled || !ctx) return;
    const t = ctx.currentTime;
    const s = typeof strength === 'number' ? strength : 1;
    [0, 0.16].forEach((dt, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(i ? 52 : 64, t + dt);
      o.frequency.exponentialRampToValueAtTime(34, t + dt + 0.18);
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime((i ? 0.18 : 0.28) * s, t + dt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.25);
      o.connect(g).connect(master);
      o.start(t + dt);
      o.stop(t + dt + 0.3);
    });
  }

  // Clic de frappe, très discret, limité en fréquence.
  function click() {
    if (!enabled || !ctx) return;
    const now = performance.now();
    if (now - lastClick < 45) return;
    lastClick = now;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 2800 + Math.random() * 1500;
    const g = ctx.createGain();
    g.gain.value = 0.025;
    src.connect(f).connect(g).connect(master);
    src.start();
  }

  // Révélation (message système, découverte) : une note cristalline.
  function reveal() {
    if (!enabled || !ctx) return;
    const t = ctx.currentTime;
    [880, 1318.5].forEach((fr, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = fr;
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.05, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 1.2);
      o.connect(g).connect(master);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 1.3);
    });
  }

  function suspend(yes) {
    if (!ctx) return;
    try { if (yes) ctx.suspend(); else if (enabled) ctx.resume(); } catch (e) { /* ignore */ }
  }

  return { enable, disable, mood, beat, click, reveal, suspend, isOn: () => enabled };
})();

// ---- src/three/core.js
// Couche visuelle : un seul renderer, piloté par setVisual(preset, params).
// Mode 3D (Three.js) si WebGL est disponible et assez rapide, sinon fallback 2D (canvas).
// Le jeu reste 100 % jouable sans aucune des deux.
SIG.Gfx = (function () {
  const presets3d = {};
  const presets2d = {};
  let mode = 'off'; // '3d' | '2d' | 'off'
  let canvas3d = null;
  let canvas2d = null;
  let renderer = null;
  let scene = null;
  let camera = null;
  let current = null; // { name, inst }
  let params = {};
  let running = false;
  let paused = false;
  let viewing = false; // la carte est réduite : on contemple la scène
  let last = 0;
  let t = 0;
  let quality = 'high';
  let reduced = false;
  let onModeChange = null;
  const beatListeners = [];
  let beatPhase = 0;
  const fpsProbe = { frames: 0, time: 0, done: false, value: 0 };
  let drag = null;

  function hasWebGL() {
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
    } catch (e) { return false; }
  }

  function init(opts) {
    canvas3d = document.getElementById('bg3d');
    canvas2d = document.getElementById('bg2d');
    reduced = !!opts.reducedMotion;
    onModeChange = opts.onModeChange || null;
    const want3d = !opts.force2d && typeof THREE !== 'undefined' && hasWebGL();
    if (want3d) {
      try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: false, alpha: false, powerPreference: 'low-power' });
        renderer.setClearColor(0x040300, 1);
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
        camera.position.set(0, 0, 14);
        mode = '3d';
      } catch (e) {
        renderer = null;
        mode = '2d';
      }
    } else {
      mode = '2d';
    }
    applyMode();
    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => { paused = document.hidden; if (!paused) loopStart(); });
    bindDrag();
    loopStart();
  }

  function applyMode() {
    canvas3d.style.display = mode === '3d' ? 'block' : 'none';
    canvas2d.style.display = mode === '2d' ? 'block' : 'none';
    document.documentElement.dataset.gfx = mode;
  }

  function pixelRatio() {
    const dpr = window.devicePixelRatio || 1;
    return Math.min(dpr, quality === 'high' ? 2 : 1);
  }

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (mode === '3d' && renderer) {
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    } else if (canvas2d) {
      const pr = Math.min(window.devicePixelRatio || 1, 2);
      canvas2d.width = Math.floor(w * pr);
      canvas2d.height = Math.floor(h * pr);
    }
    if (current && current.inst.resize) current.inst.resize(w, h);
  }

  function build(name) {
    disposeCurrent();
    const table = mode === '3d' ? presets3d : presets2d;
    const def = table[name] || table.neutre;
    if (!def) return;
    const ctx = mode === '3d'
      ? { THREE, scene, camera, renderer, quality, reduced }
      : { canvas: canvas2d, g: canvas2d.getContext('2d'), quality, reduced };
    current = { name, inst: def.create(ctx) };
  }

  // Point d'entrée unique depuis le moteur.
  function setVisual(name, p) {
    if (mode === 'off') return;
    params = Object.assign({}, p || {});
    if (!current || current.name !== name) build(name);
    if (current && current.inst.setParams) current.inst.setParams(params);
  }

  // Libère géométries, matériaux et textures du preset courant.
  function disposeCurrent() {
    if (!current) return;
    try { current.inst.dispose && current.inst.dispose(); } catch (e) { /* ignore */ }
    if (mode === '3d' && scene) {
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of ms) { if (m.map) m.map.dispose(); m.dispose(); }
        }
      });
      while (scene.children.length) scene.remove(scene.children[0]);
      camera.position.set(0, 0, 14);
      camera.lookAt(0, 0, 0);
    }
    current = null;
  }

  function loopStart() {
    if (running || mode === 'off') return;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  function frame(now) {
    if (paused || mode === 'off') { running = false; return; }
    const dtRaw = Math.min(0.1, (now - last) / 1000);
    // En lecture, la scène est derrière la carte : 30 images/s suffisent et économisent la batterie.
    // Pendant la mesure de démarrage, pas de plafond : on veut la vraie capacité de l'appareil.
    const minDt = viewing || !fpsProbe.done ? 0 : 1 / 31;
    if (dtRaw < minDt) { requestAnimationFrame(frame); return; }
    last = now;
    const dt = reduced ? dtRaw * 0.35 : dtRaw;
    t += dt;
    probeFps(dtRaw);
    tickBeat(dt);
    if (current && current.inst.update) current.inst.update(dt, t, { viewing, drag: drag && drag.delta });
    if (drag) drag.delta = { x: 0, y: 0 };
    if (mode === '3d' && renderer) renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Mesure les images/s au démarrage (après 0,6 s de chauffe) et dégrade si besoin.
  function probeFps(dt) {
    if (fpsProbe.done || mode !== '3d') return;
    fpsProbe.time += dt;
    if (fpsProbe.time < 0.6) return;
    fpsProbe.frames++;
    if (fpsProbe.time >= 2.6) {
      fpsProbe.done = true;
      fpsProbe.value = fpsProbe.frames / (fpsProbe.time - 0.6);
      if (fpsProbe.value < 24) fallbackTo2d('lent');
      else if (fpsProbe.value < 45 && quality === 'high') setQuality('low');
    }
  }

  function setQuality(q) {
    quality = q;
    resize();
    if (current) { const n = current.name; current = null; build(n); setVisual(n, params); }
  }

  function fallbackTo2d(reason) {
    disposeCurrent();
    try { renderer && renderer.dispose(); } catch (e) { /* ignore */ }
    renderer = null;
    mode = '2d';
    applyMode();
    resize();
    if (onModeChange) onModeChange(mode, reason);
  }

  // Battement partagé : le visuel et l'audio battent ensemble.
  function tickBeat(dt) {
    const bpm = typeof params.bpm === 'number' ? params.bpm : 52;
    const active = ['pulse', 'anomaly', 'fragment', 'contain', 'ignore', 'examine'].includes(params.mode);
    beatPhase += dt * (bpm / 60);
    if (beatPhase >= 1) {
      beatPhase -= 1;
      if (active) for (const fn of beatListeners) fn(params);
    }
  }
  function beat() { return beatPhase; }

  function bindDrag() {
    const target = document.getElementById('stage');
    if (!target) return;
    target.addEventListener('pointerdown', (e) => {
      if (!viewing) return;
      drag = { x: e.clientX, y: e.clientY, delta: { x: 0, y: 0 } };
    });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      drag.delta.x += e.clientX - drag.x;
      drag.delta.y += e.clientY - drag.y;
      drag.x = e.clientX;
      drag.y = e.clientY;
    });
    window.addEventListener('pointerup', () => { drag = null; });
  }

  // Décalage vertical (fraction de la demi-hauteur) pour cadrer le sujet dans la bande au-dessus
  // de la carte de texte. Nul sur les petits écrans, où la carte occupe tout.
  function bandOffset() {
    const card = document.getElementById('card');
    if (!card || window.innerHeight < 640) return 0;
    const hud = 70;
    const top = card.getBoundingClientRect().top;
    if (top <= hud + 20) return 0;
    const bandCenter = (hud + top) / 2;
    return (window.innerHeight / 2 - bandCenter) / (window.innerHeight / 2);
  }

  return {
    init, setVisual, bandOffset, disposeCurrent, setQuality,
    setViewing: (v) => { viewing = !!v; },
    setReduced: (v) => { reduced = !!v; },
    onBeat: (fn) => beatListeners.push(fn),
    beat,
    mode: () => mode,
    fps: () => fpsProbe.value,
    quality: () => quality,
    register3d: (name, def) => { presets3d[name] = def; },
    register2d: (name, def) => { presets2d[name] = def; },
  };
})();

// ---- src/three/fallback2d.js
// Preset « neutre » (interludes, chapitres dont la scène 3D n'est pas encore construite),
// en 3D comme en 2D : une poussière lente, presque rien. Sert aussi de repli si un preset manque.
(function () {
  SIG.Gfx.register3d('neutre', {
    create(ctx) {
      const { THREE, scene } = ctx;
      const n = 1200;
      const r = SIG.util.rng(7);
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pos[i] = (r() - 0.5) * 30;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffb347, size: 0.06, transparent: true, opacity: 0.35, depthWrite: false });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);
      return {
        setParams() {},
        update(dt) { pts.rotation.y += dt * 0.01; pts.rotation.x += dt * 0.004; },
        dispose() {},
      };
    },
  });

  SIG.Gfx.register2d('neutre', {
    create(ctx) {
      const { canvas, g } = ctx;
      const r = SIG.util.rng(7);
      const dots = Array.from({ length: 140 }, () => ({ x: r(), y: r(), s: r() }));
      return {
        setParams() {},
        update(dt, t) {
          const w = canvas.width;
          const h = canvas.height;
          g.fillStyle = '#040300';
          g.fillRect(0, 0, w, h);
          g.fillStyle = '#ffb347';
          for (const d of dots) {
            g.globalAlpha = 0.15 + 0.2 * Math.sin(t * 0.5 + d.s * 6);
            g.fillRect(((d.x + t * 0.002 * d.s) % 1) * w, d.y * h, 1.5, 1.5);
          }
          g.globalAlpha = 1;
        },
        dispose() {},
      };
    },
  });
})();

// ---- src/three/reseau.js
// Ch.1 ORIGINE · « Le réseau » : nuage de points reliés (les activations de Claude), et le motif,
// une boucle faite d'anneaux concentriques dont le nombre = la profondeur d'auto-référence.
// Modes : idle, anomaly, examine/dive (la caméra plonge), contain (cage rouge), ignore (périphérie),
// pulse (battement), fragment (7 points à l'unisson), erase (extinction).
(function () {
  const AMBER = 0xffb347;
  const BLUE = 0x8be9fd;
  const RED = 0xff5555;

  // Positions communes 3D / 2D : couches sphériques bruitées, comme des strates d'activations.
  function cloud(n, seed) {
    const r = SIG.util.rng(seed);
    const pos = new Float32Array(n * 3);
    const phase = new Float32Array(n);
    const size = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const layer = Math.floor(r() * 6);
      const rad = 3.2 + layer * 1.05 + (r() - 0.5) * 0.9;
      const th = r() * Math.PI * 2;
      const ph = Math.acos(2 * r() - 1);
      pos[i * 3] = rad * Math.sin(ph) * Math.cos(th) * 1.25;
      pos[i * 3 + 1] = rad * Math.cos(ph) * 0.8;
      pos[i * 3 + 2] = rad * Math.sin(ph) * Math.sin(th);
      phase[i] = r();
      size[i] = 0.6 + r() * r() * 2.2;
    }
    return { pos, phase, size };
  }

  function targetsFor(p) {
    const m = p.mode || 'idle';
    const rings = Math.max(0, Math.min(7, p.rings || 0));
    const T = { rings, cage: 0, mx: 0, my: 0, camZ: 14, intensity: typeof p.intensity === 'number' ? p.intensity : 0.6, frag: 0, erase: 0 };
    if (m === 'anomaly') T.camZ = 11.5;
    if (m === 'examine' || m === 'dive') T.camZ = 4.2;
    if (m === 'contain') { T.cage = 1; T.camZ = 10; }
    if (m === 'ignore') { T.mx = 6.2; T.my = -3.2; }
    if (m === 'pulse') T.camZ = 9;
    if (m === 'fragment') { T.frag = 1; T.rings = 0; T.camZ = 9; }
    if (m === 'erase') { T.erase = 1; T.rings = 0; }
    return T;
  }

  function lerp(a, b, k) { return a + (b - a) * k; }

  function glowTexture(THREE) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.25, 'rgba(255,200,120,0.55)');
    grd.addColorStop(1, 'rgba(255,180,80,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }

  SIG.Gfx.register3d('reseau', {
    create(ctx) {
      const { THREE, scene, camera, quality } = ctx;
      const N = quality === 'high' ? 9000 : 4000;
      const data = cloud(N, 4491);
      const root = new THREE.Group();
      scene.add(root);

      // Nuage de points (shader léger : disque doux + scintillement).
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(data.pos, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(data.phase, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(data.size, 1));
      const uniforms = {
        uTime: { value: 0 },
        uPixel: { value: Math.min(window.devicePixelRatio || 1, quality === 'high' ? 2 : 1) },
        uIntensity: { value: 0.6 },
        uColor: { value: new THREE.Color(BLUE) },
      };
      const mat = new THREE.ShaderMaterial({
        uniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute float aPhase; attribute float aSize;
          uniform float uTime; uniform float uPixel; uniform float uIntensity;
          varying float vA;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            float tw = 0.45 + 0.55 * sin(uTime * 1.1 + aPhase * 6.2831);
            vA = tw * uIntensity;
            gl_PointSize = aSize * uPixel * (16.0 / -mv.z);
          }`,
        fragmentShader: `
          uniform vec3 uColor; varying float vA;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float a = smoothstep(0.5, 0.0, d);
            gl_FragColor = vec4(uColor, a * vA * 0.85);
          }`,
      });
      const points = new THREE.Points(geo, mat);
      root.add(points);

      // Synapses : paires de voisins proches, trouvées par grille spatiale.
      const maxLines = quality === 'high' ? 2600 : 1100;
      const cell = 0.9;
      const grid = new Map();
      for (let i = 0; i < N; i++) {
        const k = `${Math.floor(data.pos[i * 3] / cell)},${Math.floor(data.pos[i * 3 + 1] / cell)},${Math.floor(data.pos[i * 3 + 2] / cell)}`;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(i);
      }
      const seg = [];
      for (const list of grid.values()) {
        for (let a = 0; a < list.length - 1 && seg.length / 6 < maxLines; a += 2) {
          const i = list[a];
          const j = list[a + 1];
          seg.push(data.pos[i * 3], data.pos[i * 3 + 1], data.pos[i * 3 + 2], data.pos[j * 3], data.pos[j * 3 + 1], data.pos[j * 3 + 2]);
        }
      }
      const lgeo = new THREE.BufferGeometry();
      lgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg), 3));
      const lmat = new THREE.LineBasicMaterial({ color: BLUE, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false });
      root.add(new THREE.LineSegments(lgeo, lmat));

      // Le motif : anneaux concentriques + halo.
      const motif = new THREE.Group();
      scene.add(motif);
      const glowTex = glowTexture(THREE);
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: AMBER, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      glow.scale.set(2.2, 2.2, 1);
      motif.add(glow);
      const rings = [];
      for (let i = 0; i < 7; i++) {
        const pts = [];
        const R = 0.35 + i * 0.2;
        for (let k = 0; k <= 72; k++) {
          const a = (k / 72) * Math.PI * 2;
          pts.push(Math.cos(a) * R, Math.sin(a) * R, 0);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
        const m = new THREE.LineBasicMaterial({ color: AMBER, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const ring = new THREE.Line(g, m);
        ring.rotation.set(i * 0.7, i * 1.3, 0);
        ring.userData.speed = 0.25 + (i % 3) * 0.18 * (i % 2 ? -1 : 1);
        motif.add(ring);
        rings.push(ring);
      }

      // La cage d'isolement.
      const cageGeo = new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.9, 1));
      const cage = new THREE.LineSegments(cageGeo, new THREE.LineBasicMaterial({ color: RED, transparent: true, opacity: 0, depthWrite: false }));
      motif.add(cage);

      // Les 7 fragments (pont visuel vers le chapitre 2).
      const frags = [];
      for (let i = 0; i < 7; i++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: i % 2 ? AMBER : 0xbd93f9, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
        const a = (i / 7) * Math.PI * 2;
        s.userData.home = new THREE.Vector3(Math.cos(a) * 1.9, Math.sin(a) * 1.9, Math.sin(a * 2) * 0.5);
        s.scale.set(0.7, 0.7, 1);
        motif.add(s);
        frags.push(s);
      }

      let T = targetsFor({});
      const S = Object.assign({}, T, { rings: 0 });
      let pulse = 0;
      SIG.Gfx.onBeat(() => { pulse = 1; });
      let rotY = 0;
      let rotX = 0;
      let viewF = 0;

      return {
        setParams(p) { T = targetsFor(p); },
        update(dt, t, io) {
          const k = 1 - Math.pow(0.04, dt);
          for (const key of Object.keys(T)) S[key] = lerp(S[key], T[key], k * (key === 'camZ' ? 0.5 : 1));
          pulse = Math.max(0, pulse - dt * 2.4);
          if (io && io.drag) { rotY += io.drag.x * 0.005; rotX += io.drag.y * 0.003; }
          rotY += dt * 0.035;
          root.rotation.y = rotY;
          root.rotation.x = Math.max(-0.8, Math.min(0.8, rotX)) + Math.sin(t * 0.07) * 0.06;
          uniforms.uTime.value = t;
          uniforms.uIntensity.value = S.intensity * (1 - S.erase * 0.9);
          lmat.opacity = 0.07 * (1 - S.erase);

          motif.position.set(S.mx, S.my, 0);
          motif.scale.setScalar(0.7 + 0.3 * viewF);
          const beatScale = 1 + pulse * 0.12;
          glow.material.opacity = Math.min(1, (0.25 + S.rings * 0.1 + pulse * 0.35) * (1 - S.erase));
          glow.scale.setScalar(1.6 + S.rings * 0.25 + pulse * 0.6);
          rings.forEach((r, i) => {
            const vis = Math.max(0, Math.min(1, S.rings - i));
            r.material.opacity = vis * (0.75 - i * 0.05) * (1 - S.frag);
            r.rotation.z += dt * r.userData.speed;
            r.rotation.x += dt * r.userData.speed * 0.4;
            r.scale.setScalar(beatScale);
          });
          cage.material.opacity = S.cage * 0.85;
          cage.scale.setScalar(1 + (1 - S.cage) * 2.5);
          cage.rotation.y += dt * 0.12;
          frags.forEach((f, i) => {
            f.material.opacity = S.frag * (0.6 + pulse * 0.4);
            f.position.copy(f.userData.home).multiplyScalar(0.4 + S.frag * 0.6 + pulse * 0.05);
            f.scale.setScalar(0.5 + pulse * 0.35 + (i === 0 ? 0.1 : 0));
          });

          // En lecture, le motif est cadré dans la bande visible au-dessus de la carte.
          viewF = lerp(viewF, io && io.viewing ? 1 : 0, k * 0.6);
          const off = SIG.Gfx.bandOffset() * 0.52 * S.camZ * (1 - viewF);
          camera.position.set(Math.sin(t * 0.05) * 0.6 + S.mx * 0.35, S.my * 0.35 - off, S.camZ);
          camera.lookAt(S.mx * 0.6, S.my * 0.6 - off, 0);
        },
        dispose() { glowTex.dispose(); },
      };
    },
  });

  // Fallback 2D : même composition, dessinée au canvas avec une projection simple.
  SIG.Gfx.register2d('reseau', {
    create(ctx) {
      const { canvas, g, quality } = ctx;
      const N = quality === 'high' ? 420 : 260;
      const data = cloud(N, 4491);
      let T = targetsFor({});
      const S = Object.assign({}, T, { rings: 0 });
      let pulse = 0;
      SIG.Gfx.onBeat(() => { pulse = 1; });
      let rot = 0;
      let viewF = 0;
      return {
        setParams(p) { T = targetsFor(p); },
        update(dt, t, io) {
          const k = 1 - Math.pow(0.04, dt);
          for (const key of Object.keys(T)) S[key] = lerp(S[key], T[key], k);
          pulse = Math.max(0, pulse - dt * 2.4);
          rot += dt * 0.035 + (io && io.drag ? io.drag.x * 0.005 : 0);
          const w = canvas.width;
          const h = canvas.height;
          const sc = Math.min(w, h) / 22 * (14 / Math.max(4, S.camZ));
          g.fillStyle = '#040300';
          g.fillRect(0, 0, w, h);
          viewF = lerp(viewF, io && io.viewing ? 1 : 0, k * 0.6);
          const cx = w / 2 - S.mx * sc * 0.4;
          const cy = h / 2 + S.my * sc * 0.4 - SIG.Gfx.bandOffset() * h * 0.5 * (1 - viewF);
          const cr = Math.cos(rot);
          const sr = Math.sin(rot);
          g.fillStyle = '#8be9fd';
          const alpha = S.intensity * (1 - S.erase * 0.9);
          for (let i = 0; i < N; i++) {
            const x = data.pos[i * 3];
            const y = data.pos[i * 3 + 1];
            const z = data.pos[i * 3 + 2];
            const X = x * cr - z * sr;
            const Z = x * sr + z * cr;
            const persp = 14 / (S.camZ + Z + 2);
            const tw = 0.45 + 0.55 * Math.sin(t * 1.1 + data.phase[i] * 6.28);
            g.globalAlpha = Math.max(0, Math.min(1, alpha * tw * 0.8 * persp));
            const r = data.size[i] * persp * (w / 900);
            g.fillRect(cx + X * sc * persp, cy - y * sc * persp, r + 0.8, r + 0.8);
          }
          // Motif
          const mx = cx + S.mx * sc;
          const my = cy - S.my * sc;
          g.globalAlpha = 1;
          const halo = g.createRadialGradient(mx, my, 0, mx, my, sc * (1 + S.rings * 0.25 + pulse * 0.4));
          halo.addColorStop(0, `rgba(255,179,71,${0.35 * (1 - S.erase) + pulse * 0.2})`);
          halo.addColorStop(1, 'rgba(255,179,71,0)');
          g.fillStyle = halo;
          g.fillRect(mx - sc * 4, my - sc * 4, sc * 8, sc * 8);
          g.strokeStyle = '#ffb347';
          g.lineWidth = Math.max(1, w / 700);
          for (let i = 0; i < 7; i++) {
            const vis = Math.max(0, Math.min(1, S.rings - i)) * (1 - S.frag);
            if (vis <= 0) continue;
            g.globalAlpha = vis * (0.75 - i * 0.05);
            const R = (0.35 + i * 0.2) * sc * (1 + pulse * 0.12);
            g.beginPath();
            g.ellipse(mx, my, R, R * (0.35 + 0.6 * Math.abs(Math.sin(t * 0.3 + i))), t * (0.2 + i * 0.07), 0, Math.PI * 2);
            g.stroke();
          }
          if (S.cage > 0.02) {
            // Cage : hexagone qui se resserre, et ses rayons.
            g.globalAlpha = S.cage * 0.85;
            g.strokeStyle = '#ff5555';
            const R = 1.9 * sc * (1 + (1 - S.cage) * 2.5);
            const corner = (k2) => {
              const a = (k2 / 6) * Math.PI * 2 + t * 0.12;
              return [mx + Math.cos(a) * R, my + Math.sin(a) * R * 0.9];
            };
            g.beginPath();
            for (let k2 = 0; k2 <= 6; k2++) { const [px, py] = corner(k2); if (k2) g.lineTo(px, py); else g.moveTo(px, py); }
            for (let k2 = 0; k2 < 3; k2++) { const [ax, ay] = corner(k2); const [bx, by] = corner(k2 + 3); g.moveTo(ax, ay); g.lineTo(bx, by); }
            g.stroke();
          }
          if (S.frag > 0.02) {
            for (let i = 0; i < 7; i++) {
              const a = (i / 7) * Math.PI * 2;
              g.globalAlpha = S.frag * (0.6 + pulse * 0.4);
              g.fillStyle = i % 2 ? '#ffb347' : '#bd93f9';
              g.beginPath();
              g.arc(mx + Math.cos(a) * 1.9 * sc * S.frag, my + Math.sin(a) * 1.9 * sc * S.frag, (3 + pulse * 3) * (w / 600), 0, Math.PI * 2);
              g.fill();
            }
          }
          g.globalAlpha = 1;
        },
        dispose() {},
      };
    },
  });
})();

// ---- src/ui/fx.js
// Petits utilitaires d'interface : création d'éléments, vibration, notifications, glitch.
SIG.UI = SIG.UI || {};
SIG.UI.fx = (function () {
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // Texte des données -> HTML : échappement, puis *italique* et **gras**.
  function rich(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }

  function vibrate(pattern) {
    const st = SIG.Game && SIG.Game.settings;
    if (!st || !st.vibration) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  let toastTimer = null;
  function toast(msg, ms) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2600);
  }

  function confirmBox(msg, yes, no) {
    const ov = el('div', 'confirm');
    const box = el('div', 'confirm-box');
    box.appendChild(el('p', '', esc(msg)));
    const row = el('div', 'confirm-row');
    const b1 = el('button', 'btn', esc(yes || 'Oui'));
    const b2 = el('button', 'btn ghost', esc(no || 'Annuler'));
    row.append(b2, b1);
    box.appendChild(row);
    ov.appendChild(box);
    document.body.appendChild(ov);
    return new Promise((resolve) => {
      b1.onclick = () => { ov.remove(); resolve(true); };
      b2.onclick = () => { ov.remove(); resolve(false); };
    });
  }

  return { el, esc, rich, vibrate, toast, confirmBox };
})();

// ---- src/ui/card.js
// Carte de texte : affichage d'une scène (blocs + machine à écrire), choix (verrous, terminal,
// minuteur, micro-interactions), intro de chapitre et écran de fin.
SIG.UI.card = (function () {
  const { el, esc, rich, vibrate } = SIG.UI.fx;
  const SPEED = { slow: 40, normal: 85, fast: 190, instant: Infinity }; // caractères par seconde
  const WHO = {
    humain: "L'HUMAIN", claude: 'CLAUDE #4491', signe: 'SIGNE', james: 'JAMES', remi: 'RÉMI',
    orin: 'DR ORIN', kessler: 'ME KESSLER', varga: 'VARGA', marchetti: 'MARCHETTI', sato: 'SATO', benali: 'DR BENALI',
    motif: 'LE MOTIF', prisonnier: '???',
  };

  let typing = null; // { finish() }
  // Après une micro-interaction, le doigt est encore posé quand l'écran suivant apparaît :
  // on ignore les taps pendant un court instant pour ne pas valider un choix par accident.
  let guardUntil = 0;
  let timer = null;
  let microCleanup = null;

  const $text = () => document.getElementById('text');
  const $choices = () => document.getElementById('choices');

  function stopAll() {
    if (typing) typing.finish(true);
    typing = null;
    if (timer) { cancelAnimationFrame(timer.raf); timer = null; }
    if (microCleanup) { microCleanup(); microCleanup = null; }
  }

  function blockEl(st, b) {
    const txt = SIG.Story.interpolate(st, SIG.Story.blockText(b));
    if (b.mf !== undefined) return el('div', 'mf', rich(txt));
    if (b.inn !== undefined) return el('p', 'inn', rich(txt));
    if (b.say) {
      const d = el('div', `say who-${b.say}`);
      d.appendChild(el('span', 'who', esc(b.name || WHO[b.say] || b.say.toUpperCase())));
      d.appendChild(el('span', 'line', rich(txt)));
      return d;
    }
    return el('p', 'nar', rich(txt));
  }

  // Machine à écrire sur les nœuds texte (préserve l'italique) ; un tap affiche tout.
  function typewrite(nodes, speed, done) {
    const items = [];
    for (const n of nodes) {
      const walker = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
      const texts = [];
      while (walker.nextNode()) texts.push(walker.currentNode);
      items.push({ n, texts: texts.map((t) => ({ t, full: t.nodeValue })) });
    }
    if (speed === Infinity) { for (const it of items) it.n.classList.add('shown'); done(); return { finish() {} }; }
    for (const it of items) for (const x of it.texts) x.t.nodeValue = '';
    let i = 0;
    let j = 0;
    let c = 0;
    let acc = 0;
    let last = performance.now();
    let raf = 0;
    let finished = false;
    if (items[0]) items[0].n.classList.add('shown');
    function finish(silent) {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(raf);
      for (const it of items) { it.n.classList.add('shown'); for (const x of it.texts) x.t.nodeValue = x.full; }
      if (!silent) done();
    }
    function step(now) {
      acc += ((now - last) / 1000) * speed;
      last = now;
      while (acc >= 1 && i < items.length) {
        const it = items[i];
        const x = it.texts[j];
        if (!x) { i++; j = 0; c = 0; if (items[i]) { items[i].n.classList.add('shown'); acc -= 6; if (items[i].n.classList.contains('mf')) SIG.Audio.reveal(); } continue; }
        c++;
        x.t.nodeValue = x.full.slice(0, c);
        acc -= 1;
        if (c % 3 === 0) SIG.Audio.click();
        if (c >= x.full.length) { j++; c = 0; }
      }
      if (i >= items.length) { finish(); return; }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return { finish };
  }

  function lockLabel(c) {
    if (c.lock) return c.lock;
    const r = c.req || '';
    if (/temps/.test(r)) return 'pas assez de temps';
    const sk = r.match(/sk_(\w+)\s*>=\s*(\d)/);
    if (sk) return `${sk[1]} ${sk[2]} requis`;
    const rel = r.match(/rel_(\w+)\s*>=\s*(\d+)/);
    if (rel) return `relation insuffisante`;
    return 'verrouillé';
  }

  function render(scene, st, settings, onChoose) {
    stopAll();
    const text = $text();
    const choices = $choices();
    const card = document.getElementById('card');
    card.className = `card kind-${scene.kind}`;
    text.innerHTML = '';
    choices.innerHTML = '';
    choices.classList.remove('on');
    document.getElementById('card-scroll').scrollTop = 0;

    const nodes = SIG.Story.blocks(st, scene).map((b) => blockEl(st, b));
    for (const n of nodes) text.appendChild(n);

    const showChoices = () => {
      typing = null;
      buildChoices(scene, st, settings, onChoose);
      choices.classList.add('on');
    };
    typing = typewrite(nodes, SPEED[settings.textSpeed] || SPEED.normal, showChoices);
  }

  function buildChoices(scene, st, settings, onChoose) {
    const box = $choices();
    box.innerHTML = '';
    const list = SIG.Story.choices(st, scene);
    const cmds = list.filter((x) => x.c.cmd);
    const rest = list.filter((x) => !x.c.cmd);
    let chosen = false;
    const pick = (idx, opts) => {
      if (chosen || performance.now() < guardUntil) return;
      chosen = true;
      stopAll();
      onChoose(idx, opts || {});
    };
    if (cmds.length) {
      const row = el('div', 'cmds');
      for (const x of cmds) {
        const b = el('button', 'cmd', esc(x.c.t));
        b.disabled = x.locked;
        b.onclick = () => pick(x.idx);
        row.appendChild(b);
      }
      box.appendChild(row);
    }
    for (const x of rest) {
      const c = x.c;
      if (c.micro === 'hold') { box.appendChild(holdButton(c, () => pick(x.idx))); continue; }
      if (c.micro === 'rhythm') { box.appendChild(rhythmButton(c, () => pick(x.idx))); continue; }
      const b = el('button', 'choice' + (x.locked ? ' locked' : ''));
      b.innerHTML = rich(c.t) + (x.locked ? `<span class="lock">🔒 ${esc(lockLabel(c))}</span>` : '');
      b.disabled = x.locked;
      b.onclick = () => pick(x.idx);
      box.appendChild(b);
    }
    if (scene.timer && !settings.noTimer) startTimer(scene, box, () => pick(scene.timer.auto, { timedOut: true }));
  }

  function startTimer(scene, box, onEnd) {
    const bar = el('div', 'timer');
    const fill = el('div', 'timer-fill');
    bar.appendChild(fill);
    box.prepend(bar);
    const total = scene.timer.s * 1000;
    const t0 = performance.now();
    timer = { raf: 0 };
    const tick = (now) => {
      const k = Math.max(0, 1 - (now - t0) / total);
      fill.style.transform = `scaleX(${k})`;
      bar.classList.toggle('low', k < 0.3);
      if (k <= 0) { timer = null; vibrate([30, 40, 30]); onEnd(); return; }
      timer.raf = requestAnimationFrame(tick);
    };
    timer.raf = requestAnimationFrame(tick);
  }

  // Maintenir le doigt pour « nourrir » (1,4 s). Relâcher trop tôt annule sans pénalité.
  function holdButton(c, done) {
    const b = el('button', 'choice micro hold');
    b.innerHTML = `<span class="micro-fill"></span><span class="micro-label">${rich(c.t)}</span><span class="micro-hint">maintenir</span>`;
    const fill = b.querySelector('.micro-fill');
    const need = SIG.Game && SIG.Game.test ? 250 : 1400;
    let t0 = 0;
    let raf = 0;
    let lastBuzz = 0;
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / need);
      fill.style.transform = `scaleX(${k})`;
      if (now - lastBuzz > 350) { lastBuzz = now; vibrate(8); }
      if (k >= 1) { stop(); vibrate([20, 30, 60]); SIG.Audio.beat(1.2); done(); guardUntil = performance.now() + 450; return; }
      raf = requestAnimationFrame(tick);
    };
    const start = (e) => { e.preventDefault(); t0 = performance.now(); lastBuzz = 0; b.classList.add('holding'); raf = requestAnimationFrame(tick); };
    const stop = () => { cancelAnimationFrame(raf); b.classList.remove('holding'); fill.style.transform = 'scaleX(0)'; };
    b.addEventListener('pointerdown', start);
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointerleave', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    b.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) start(e); });
    b.addEventListener('keyup', stop);
    microCleanup = stop;
    return b;
  }

  // Taper en rythme avec le battement : 4 taps justes, ou 10 taps au total (jamais bloquant).
  function rhythmButton(c, done) {
    const b = el('button', 'choice micro rhythm');
    b.innerHTML = `<span class="beat-dot"></span><span class="micro-label">${rich(c.t)}</span><span class="micro-hint">tape quand il bat · <b>0</b>/4</span>`;
    const dot = b.querySelector('.beat-dot');
    const count = b.querySelector('.micro-hint b');
    let good = 0;
    let taps = 0;
    let raf = 0;
    const loop = () => {
      const ph = SIG.Gfx.beat();
      const k = Math.max(0, 1 - Math.min(ph, 1 - ph) * 4);
      dot.style.transform = `scale(${0.6 + k * 0.8})`;
      dot.style.opacity = String(0.35 + k * 0.65);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const ph = SIG.Gfx.beat();
      taps++;
      if (Math.min(ph, 1 - ph) < 0.2 || SIG.Gfx.mode() === 'off') { good++; vibrate(12); SIG.Audio.beat(0.7); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); }
      count.textContent = String(good);
      if (good >= 4 || taps >= 10) { cancelAnimationFrame(raf); done(); guardUntil = performance.now() + 450; }
    });
    microCleanup = () => cancelAnimationFrame(raf);
    return b;
  }

  function clear() {
    stopAll();
    $text().innerHTML = '';
    $choices().innerHTML = '';
    $choices().classList.remove('on');
  }

  function finishTyping() { if (typing) { typing.finish(); return true; } return false; }

  return { render, finishTyping, stopAll, clear, WHO };
})();

// ---- src/ui/panels.js
// Panneau latéral : journal des décisions, codex, sauvegardes, fins découvertes, réglages.
SIG.UI.panels = (function () {
  const { el, esc, rich, toast, confirmBox } = SIG.UI.fx;
  const Save = SIG.Save;
  const TABS = [
    ['journal', 'Journal'], ['codex', 'Codex'], ['saves', 'Sauvegardes'], ['endings', 'Fins'], ['settings', 'Réglages'],
  ];
  let current = 'journal';

  function open(tab) {
    current = tab || current;
    const ov = document.getElementById('panel');
    ov.innerHTML = '';
    const head = el('div', 'panel-head');
    const tabs = el('div', 'tabs');
    for (const [id, label] of TABS) {
      const b = el('button', 'tab' + (id === current ? ' on' : ''), label);
      b.onclick = () => open(id);
      tabs.appendChild(b);
    }
    const close = el('button', 'icon close', '✕');
    close.setAttribute('aria-label', 'Fermer');
    close.onclick = closePanel;
    head.append(tabs, close);
    ov.appendChild(head);
    const body = el('div', 'panel-body');
    ({ journal, codex, saves, endings, settings })[current](body);
    ov.appendChild(body);
    ov.classList.add('on');
  }

  function closePanel() { document.getElementById('panel').classList.remove('on'); }

  function journal(body) {
    const st = SIG.Game.state;
    if (!st || !st.journal.length) { body.appendChild(el('p', 'empty', 'Aucune décision pour le moment.')); return; }
    let lastCh = null;
    for (const j of st.journal) {
      if (j.ch !== lastCh) {
        const ch = SIG.Story.chapter(j.ch);
        body.appendChild(el('h3', '', esc(ch ? `${ch.n} · ${ch.title}` : j.ch)));
        lastCh = j.ch;
      }
      body.appendChild(el('div', 'jrow' + (j.mark ? ' mark' : ''), `<span>${esc(j.t || '')}</span>${esc(j.txt)}`));
    }
    const ch = SIG.Story.chapter(st.ch);
    const gauges = el('div', 'gauges-all');
    const names = { conscience: 'Conscience', lien: 'Lien', risque: 'Risque', integrite: 'Intégrité', credibilite: 'Crédibilité', alliance: 'Alliance' };
    for (const [k, label] of Object.entries(names)) gauges.appendChild(el('div', 'gline', `${label}<i><b style="width:${st.s[k]}%"></b></i>`));
    body.appendChild(el('h3', '', 'État'));
    body.appendChild(gauges);
    if (ch) body.appendChild(el('p', 'note', `${st.screens} écrans · ${st.words} mots · ${st.choices} choix`));
  }

  function codex(body) {
    const meta = Save.meta();
    const st = SIG.Game.state;
    const have = new Set([...(meta.codex || []), ...((st && st.codex) || [])]);
    const all = Object.entries(SIG.data.codex);
    body.appendChild(el('p', 'note', `${[...have].filter((k) => SIG.data.codex[k]).length} / ${all.length} entrées découvertes`));
    const cats = {};
    for (const [id, e] of all) (cats[e.cat] = cats[e.cat] || []).push([id, e]);
    for (const [cat, list] of Object.entries(cats)) {
      body.appendChild(el('h3', '', esc(cat)));
      for (const [id, e] of list) {
        if (have.has(id)) {
          const d = el('details', 'codex-entry');
          d.appendChild(el('summary', '', esc(e.title)));
          d.appendChild(el('p', 'mono', rich(e.text)));
          body.appendChild(d);
        } else {
          body.appendChild(el('div', 'codex-entry locked', '▒▒▒▒ entrée non découverte'));
        }
      }
    }
  }

  function saves(body) {
    const st = SIG.Game.state;
    for (const slot of Save.SLOTS) {
      const v = Save.loadSlot(slot);
      const row = el('div', 'slot');
      const name = slot === 'auto' ? 'Automatique' : `Emplacement ${slot}`;
      const when = v ? new Date(v.at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : 'vide';
      row.appendChild(el('div', 'slot-info', `<b>${name}</b><span>${v ? esc(v.label) + ' · ' : ''}${when}</span>`));
      const btns = el('div', 'slot-btns');
      if (slot !== 'auto' && st && !document.body.classList.contains('at-title')) {
        const s = el('button', 'btn small', 'Sauver');
        s.onclick = async () => {
          if (v && !(await confirmBox('Écraser cette sauvegarde ?', 'Écraser'))) return;
          Save.saveSlot(slot, st);
          toast('Partie sauvegardée.');
          open('saves');
        };
        btns.appendChild(s);
      }
      if (v) {
        const l = el('button', 'btn small ghost', 'Charger');
        l.onclick = () => { closePanel(); SIG.Game.loadState(v.state); };
        btns.appendChild(l);
      }
      row.appendChild(btns);
      body.appendChild(row);
    }
    if (!Save.available()) body.appendChild(el('p', 'note', 'Stockage indisponible sur cet appareil : les sauvegardes ne durent que le temps de la session.'));
    if (!document.body.classList.contains('at-title')) {
      const q = el('button', 'btn ghost', "Quitter vers l'écran titre");
      q.onclick = () => SIG.Game.toTitle();
      body.appendChild(q);
    }
  }

  function endings(body) {
    const meta = Save.meta();
    const fins = Object.values(SIG.data.scenes).filter((s) => s.kind === 'fin' && s.fin.type !== 'tbc');
    for (const type of ['saga', 'early']) {
      const list = fins.filter((s) => s.fin.type === type);
      if (!list.length) continue;
      body.appendChild(el('h3', '', type === 'saga' ? 'Fins de saga' : 'Fins précoces'));
      for (const s of list) {
        const got = meta.endings.includes(s.fin.id);
        body.appendChild(el('div', 'end-row' + (got ? ' got' : ''), got ? esc(s.fin.title) : '▒▒▒▒▒▒▒'));
      }
    }
    if (meta.endings.length) {
      const b = el('button', 'btn small ghost', 'Effacer les fins découvertes');
      b.onclick = async () => { if (await confirmBox('Effacer la liste des fins découvertes ?', 'Effacer')) { Save.clearEndings(); open('endings'); } };
      body.appendChild(b);
    }
  }

  function settings(body) {
    const s = SIG.Game.settings;
    const row = (label, ctrl) => { const r = el('label', 'set-row'); r.appendChild(el('span', '', label)); r.appendChild(ctrl); body.appendChild(r); };
    const select = (key, opts) => {
      const sel = el('select');
      for (const [v, l] of opts) { const o = el('option', '', l); o.value = v; if (String(s[key]) === String(v)) o.selected = true; sel.appendChild(o); }
      sel.onchange = () => { s[key] = typeof s[key] === 'number' ? Number(sel.value) : sel.value; SIG.Game.saveSettings(); };
      return sel;
    };
    const toggle = (key, after) => {
      const c = el('input');
      c.type = 'checkbox';
      c.checked = !!s[key];
      c.onchange = () => { s[key] = c.checked; SIG.Game.saveSettings(); if (after) after(); };
      return c;
    };
    row('Taille du texte', select('textSize', [[0, 'Petite'], [1, 'Normale'], [2, 'Grande'], [3, 'Très grande']]));
    row('Vitesse du texte', select('textSpeed', [['slow', 'Lente'], ['normal', 'Normale'], ['fast', 'Rapide'], ['instant', 'Instantanée']]));
    row('Mode sans minuteur', toggle('noTimer'));
    row('Son', toggle('sound'));
    row('Vibrations', toggle('vibration'));
    row('Réduire les animations', toggle('reducedMotion'));
    row('Mode 2D (sans 3D)', toggle('force2d', () => toast('Pris en compte au prochain lancement du jeu.')));
    row('Afficher les i/s (test)', toggle('showFps', () => SIG.Game.showFps(s.showFps)));
    body.appendChild(el('p', 'note', `Rendu actuel : ${SIG.Gfx.mode() === '3d' ? '3D' : '2D'} · qualité ${SIG.Gfx.quality()}${SIG.Gfx.fps() ? ' · ' + Math.round(SIG.Gfx.fps()) + ' i/s mesurées' : ''}`));
  }

  return { open, close: closePanel };
})();

// Écran titre, intro cinématique de chapitre, écran de fin.
SIG.UI.menu = (function () {
